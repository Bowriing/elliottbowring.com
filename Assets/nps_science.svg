
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#F4F8F6"/>

  <!-- Baseline -->
  <path d="M75 215 H525"
        stroke="#9DBBAF" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Detractors -->
  <g fill="#E26570">
    <rect x="105" y="135" width="36" height="80" rx="18"/>
    <rect x="151" y="152" width="27" height="63" rx="13.5"/>
    <rect x="197" y="166" width="20" height="49" rx="10"/>
  </g>

  <!-- Promoters -->
  <g fill="#5BB877">
    <rect x="363" y="157" width="36" height="58" rx="18"/>
    <rect x="414" y="125" width="36" height="90" rx="18"/>
    <rect x="465" y="95" width="36" height="120" rx="18"/>
  </g>

  <!-- Prediction curve shading -->
  <path d="M75 215
           C175 215 220 212 300 125
           S420 40 525 40
           L525 215 Z"
        fill="#0B6845" opacity="0.055"/>

  <!-- ML prediction curve -->
  <path d="M75 215
           C175 215 220 212 300 125
           S420 40 525 40"
        fill="none" stroke="#08633F"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Classification threshold -->
  <path d="M300 40 V215"
        stroke="#A7C5B7" stroke-width="3"
        stroke-dasharray="7 10"
        stroke-linecap="round"/>

  <!-- Prediction threshold marker -->
  <circle cx="300" cy="125" r="10"
          fill="#F4F8F6"
          stroke="#08633F" stroke-width="4"/>
</svg>
