
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#FFF8F0"/>

  <!-- Measurement grid -->
  <g stroke="#F1D9BE" stroke-width="1" opacity=".65">
    <path d="M65 95 H535"/>
    <path d="M65 130 H535"/>
    <path d="M65 165 H535"/>
    <path d="M65 200 H535"/>
    <path d="M65 235 H535"/>
  </g>

  <!-- Electrical waveform -->
  <path d="
    M65 165 H130
    C153 165 153 108 177 108
    S203 222 228 222
    S255 108 280 108
    S307 222 332 222
    S358 165 385 165
    H535"
    fill="none"
    stroke="#F4AE65"
    stroke-width="4"
    stroke-linecap="round"/>

  <!-- Central power symbol -->
  <circle cx="300" cy="150" r="78"
          fill="#FFF8F0"
          stroke="#C65B12"
          stroke-width="4"/>

  <circle cx="300" cy="150" r="65"
          fill="#F28C28"
          fill-opacity=".08"/>

  <!-- Lightning bolt -->
  <path d="
    M314 91
    L266 159
    H299
    L285 210
    L337 138
    H304 Z"
    fill="#E87919"
    stroke="#C65B12"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- Power consumption bars -->
  <g fill="#E87919">
    <rect x="434" y="196" width="15" height="39"
          rx="4" opacity=".4"/>
    <rect x="457" y="177" width="15" height="58"
          rx="4" opacity=".6"/>
    <rect x="480" y="155" width="15" height="80"
          rx="4" opacity=".9"/>
    <rect x="503" y="183" width="15" height="52"
          rx="4" opacity=".55"/>
  </g>

  <path d="M424 235 H528"
        stroke="#D8B38E"
        stroke-width="2"/>
</svg>
